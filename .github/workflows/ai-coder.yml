name: AI Autonomous Coder

on:
  repository_dispatch:
    types: [ai-task]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run Gemini Code Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ github.event.client_payload.prompt }}
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action (Gemini AI)"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(ai): ${{ github.event.client_payload.prompt }}"
            git push origin main
          fi
