name: AI Autonomous Coder

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Опишите правки для Mini App'
        required: true
        default: 'Добавь красивую анимацию при нажатии на кнопки'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run OpenRouter Code Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        run: python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UI via OpenRouter: ${{ github.event.inputs.prompt }}" && git push)
