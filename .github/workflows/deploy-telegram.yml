name: Verify and deploy Telegram Mini App

on:
  push:
    branches: [main]
    paths:
      - "TelegramBookingApp-v1/**"
      - ".github/workflows/deploy-telegram.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelegramBookingApp-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelegramBookingApp-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
