<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бронирование</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --ios-bg-glass: rgba(255, 255, 255, 0.45);
      --ios-card-glass: rgba(255, 255, 255, 0.65);
      --ios-border: rgba(255, 255, 255, 0.5);
      --ios-accent: #007AFF;
      --ios-accent-gradient: linear-gradient(135deg, #007AFF 0%, #00C6FF 100%);
      --ios-text-primary: #000000;
      --ios-text-secondary: rgba(60, 60, 67, 0.6);
      --ios-shadow: 0 12px 32px 0 rgba(31, 38, 135, 0.08);
      --ios-blur: blur(25px) saturate(190%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ios-bg-glass: rgba(25, 25, 30, 0.5);
        --ios-card-glass: rgba(35, 35, 45, 0.65);
        --ios-border: rgba(255, 255, 255, 0.12);
        --ios-text-primary: #FFFFFF;
        --ios-text-secondary: rgba(235, 235, 245, 0.6);
        --ios-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      background: var(--tg-theme-bg-color, #f0f2f5);
      color: var(--ios-text-primary);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      text-align: center;
      margin-top: 8px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--ios-text-secondary);
      margin-top: 4px;
      font-weight: 400;
    }

    /* Liquid Glass Card */
    .glass-card {
      background: var(--ios-card-glass);
      backdrop-filter: var(--ios-blur);
      -webkit-backdrop-filter: var(--ios-blur);
      border: 1px solid var(--ios-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--ios-shadow);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Calendar Header */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .calendar-nav {
      background: var(--ios-bg-glass);
      border: 1px solid var(--ios-border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--ios-accent);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease;
    }

    .calendar-nav:active {
      transform: scale(0.9);
    }

    /* Grid Layout */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }

    .day-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-text-secondary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .day-number {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .day-number.empty {
      cursor: default;
    }

    .day-number:not(.empty):active {
      transform: scale(0.88);
    }

    .day-number.selected {
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
    }

    /* Time Slots Grid */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .time-slot {
      background: var(--ios-bg-glass);
      border: 1px solid var(--ios-border);
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .time-slot:active {
      transform: scale(0.94);
    }

    .time-slot.selected {
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
    }

    /* Main Floating CTA Button */
    .ios-btn {
      width: 100%;
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      margin-top: auto;
    }

    .ios-btn:disabled {
      opacity: 0.4;
      box-shadow: none;
      cursor: not-allowed;
      transform: none !important;
    }

    .ios-btn:not(:disabled):active {
      transform: scale(0.96);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Выбор времени</h1>
    <p>Выберите удобную дату приема</p>
  </div>

  <div class="glass-card">
    <div class="calendar-header">
      <button class="calendar-nav" id="prev-month">✕</button>
      <h2 id="month-year-label">Месяц</h2>
      <button class="calendar-nav" id="next-month">❯</button>
    </div>
    
    <div class="days-grid" id="days-container"></div>
  </div>

  <div class="glass-card" id="time-section" style="display: none;">
    <h2 style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ios-text-secondary);">Доступные слоты</h2>
    <div class="time-grid" id="time-container">
      <div class="time-slot" onclick="selectTime(this, '09:00')">09:00</div>
      <div class="time-slot" onclick="selectTime(this, '11:30')">11:30</div>
      <div class="time-slot" onclick="selectTime(this, '14:00')">14:00</div>
      <div class="time-slot" onclick="selectTime(this, '16:30')">16:30</div>
      <div class="time-slot" onclick="selectTime(this, '19:00')">19:00</div>
    </div>
  </div>

  <button class="ios-btn" id="submit-btn" disabled onclick="confirmBooking()">Подтвердить запись</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentDate = new Date();
    let selectedDate = null;
    let selectedTime = null;

    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

    // Установка иконки навигации
    document.getElementById('prev-month').innerText = '❮';

    function renderCalendar() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('month-year-label').innerText = `${monthNames[month]} ${year}`;

      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = 'day-name';
        el.innerText = d;
        container.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const startingPoint = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startingPoint; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-number empty';
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-number';
        cell.innerText = day;
        cell.onclick = () => selectDate(cell, day, month, year);
        container.appendChild(cell);
      }
    }

    function selectDate(element, day, month, year) {
      document.querySelectorAll('.day-number').forEach(e => e.classList.remove('selected'));
      element.classList.add('selected');
      selectedDate = `${day}.${month + 1}.${year}`;
      
      const timeSection = document.getElementById('time-section');
      timeSection.style.display = 'block';
      timeSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
      checkForm();
    }

    function selectTime(element, time) {
      document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
      element.classList.add('selected');
      selectedTime = time;
      checkForm();
    }

    function checkForm() {
      const btn = document.getElementById('submit-btn');
      if (selectedDate && selectedTime) {
        btn.disabled = false;
        btn.innerText = `Записаться на ${selectedDate} в ${selectedTime}`;
      } else {
        btn.disabled = true;
        btn.innerText = 'Подтвердить запись';
      }
    }

    function confirmBooking() {
      if (selectedDate && selectedTime) {
        tg.sendData(JSON.stringify({ date: selectedDate, time: selectedTime }));
        tg.close();
      }
    }

    document.getElementById('prev-month').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('next-month').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };

    renderCalendar();
  </script>
</body>
</html>
