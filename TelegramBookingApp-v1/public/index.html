<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Онлайн-запись</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --primary: var(--tg-theme-button-color, #007aff);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: #ff3b30;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }

    /* Карточки */
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    /* Выбор услуги */
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    /* Лента дней (Горизонтальный скролл) */
    .days-ribbon {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .days-ribbon::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 65px;
      padding: 10px 6px;
      background: var(--bg);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .day-chip .weekday {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
      font-weight: 600;
    }

    .day-chip .day-num {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0;
    }

    .day-chip .month-name {
      font-size: 11px;
      color: var(--hint);
    }

    .day-chip.selected {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .day-chip.selected .weekday,
    .day-chip.selected .month-name {
      color: rgba(255, 255, 255, 0.8);
    }

    /* Сетка времени */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .time-slot {
      padding: 10px 4px;
      text-align: center;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .time-slot.selected {
      background: var(--primary);
      color: var(--primary-text);
    }

    .time-slot.custom-btn {
      background: rgba(0, 122, 255, 0.1);
      color: var(--primary);
      grid-column: span 2;
    }

    /* Скрытое поле ввода своего времени */
    .custom-time-wrapper {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .custom-time-wrapper input[type="time"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    /* Кнопки */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--primary);
      color: var(--primary-text);
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--hint);
    }

    /* Модальное окно */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-content {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.25s ease-out;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .hidden { display: none !important; }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Услуга -->
  <div class="card">
    <div class="card-title">1. Выберите услугу</div>
    <select id="service-select">
      <option value="Стрижка">Стрижка</option>
      <option value="Окрашивание">Окрашивание</option>
      <option value="Маникюр">Маникюр</option>
    </select>
  </div>

  <!-- Дни прямо на экране -->
  <div class="card">
    <div class="card-title">2. Дата записи</div>
    <div class="days-ribbon" id="days-container"></div>
  </div>

  <!-- Время начиная с 7:00 -->
  <div class="card">
    <div class="card-title">3. Время записи</div>
    <div class="time-grid" id="time-container">
      <div class="time-slot" data-time="07:00">07:00</div>
      <div class="time-slot" data-time="08:00">08:00</div>
      <div class="time-slot" data-time="09:00">09:00</div>
      <div class="time-slot" data-time="10:00">10:00</div>
      <div class="time-slot" data-time="11:00">11:00</div>
      <div class="time-slot" data-time="12:00">12:00</div>
      <div class="time-slot" data-time="13:00">13:00</div>
      <div class="time-slot" data-time="14:00">14:00</div>
      <div class="time-slot" data-time="15:00">15:00</div>
      <div class="time-slot" data-time="16:00">16:00</div>
      <div class="time-slot" data-time="17:00">17:00</div>
      <div class="time-slot" data-time="18:00">18:00</div>
      <div class="time-slot" data-time="19:00">19:00</div>
      <div class="time-slot" data-time="20:00">20:00</div>
      <div class="time-slot custom-btn" id="custom-time-btn">+ Свое время</div>
    </div>

    <!-- Поле для своего времени -->
    <div class="custom-time-wrapper hidden" id="custom-time-box">
      <input type="time" id="custom-time-input" value="07:30">
    </div>
  </div>

  <!-- Главная кнопка -->
  <button class="btn" id="open-modal-btn" disabled>Записаться</button>
</div>

<!-- Модальное окно подтверждения -->
<div class="modal hidden" id="booking-modal">
  <div class="modal-content">
    <h3>Подтверждение записи</h3>
    <p id="summary-text" style="font-size: 14px; color: var(--hint);"></p>

    <div>
      <input type="text" id="client-name" class="input-field" placeholder="Ваше имя">
    </div>

    <div>
      <input type="tel" id="client-phone" class="input-field" placeholder="Номер телефона *">
      <span class="error-msg hidden" id="phone-error">Введите корректный номер (от 10 цифр)</span>
    </div>

    <div class="modal-actions">
      <!-- Нажатие "Отмена" ЗАКРЫВАЕТ окно БЕЗ проверок -->
      <button class="btn btn-secondary" id="cancel-btn">Отмена</button>
      <!-- Нажатие "Подтвердить" ЗАПУСКАЕТ проверку -->
      <button class="btn" id="confirm-btn">Записаться</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Состояние
  let selectedDateStr = null;
  let selectedTime = null;

  // Элементы
  const daysContainer = document.getElementById('days-container');
  const timeSlots = document.querySelectorAll('.time-slot:not(.custom-btn)');
  const customTimeBtn = document.getElementById('custom-time-btn');
  const customTimeBox = document.getElementById('custom-time-box');
  const customTimeInput = document.getElementById('custom-time-input');
  const openModalBtn = document.getElementById('open-modal-btn');
  
  const modal = document.getElementById('booking-modal');
  const cancelBtn = document.getElementById('cancel-btn');
  const confirmBtn = document.getElementById('confirm-btn');
  const phoneInput = document.getElementById('client-phone');
  const phoneError = document.getElementById('phone-error');
  const summaryText = document.getElementById('summary-text');

  const weekdays = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

  // Generates 30 ближайших дней
  function generateDaysRibbon() {
    daysContainer.innerHTML = '';
    const today = new Date();

    for (let i = 0; i < 30; i++) {
      const d = new Date();
      d.setDate(today.getDate() + i);

      const year = d.getFullYear();
      const monthStr = String(d.getMonth() + 1).padStart(2, '0');
      const dayStr = String(d.getDate()).padStart(2, '0');
      const fullDateStr = `${year}-${monthStr}-${dayStr}`;

      const chip = document.createElement('div');
      chip.className = 'day-chip';
      chip.innerHTML = `
        <div class="weekday">${weekdays[d.getDay()]}</div>
        <div class="day-num">${d.getDate()}</div>
        <div class="month-name">${months[d.getMonth()]}</div>
      `;

      // По умолчанию выбираем первый день (сегодня)
      if (i === 0) {
        chip.classList.add('selected');
        selectedDateStr = fullDateStr;
      }

      chip.addEventListener('click', () => {
        document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedDateStr = fullDateStr;
        checkReady();
      });

      daysContainer.appendChild(chip);
    }
  }

  // Выбор стандартного слота времени
  timeSlots.forEach(slot => {
    slot.addEventListener('click', () => {
      clearTimeSelection();
      slot.classList.add('selected');
      selectedTime = slot.dataset.time;
      checkReady();
    });
  });

  // Кнопка свой выбор времени
  customTimeBtn.addEventListener('click', () => {
    clearTimeSelection();
    customTimeBtn.classList.add('selected');
    customTimeBox.classList.remove('hidden');
    selectedTime = customTimeInput.value;
    checkReady();
  });

  customTimeInput.addEventListener('input', (e) => {
    selectedTime = e.target.value;
    checkReady();
  });

  function clearTimeSelection() {
    timeSlots.forEach(s => s.classList.remove('selected'));
    customTimeBtn.classList.remove('selected');
    customTimeBox.classList.add('hidden');
    selectedTime = null;
  }

  function checkReady() {
    openModalBtn.disabled = !(selectedDateStr && selectedTime);
  }

  // Открытие модалки
  openModalBtn.addEventListener('click', () => {
    const serviceName = document.getElementById('service-select').value;
    summaryText.innerText = `${serviceName} — ${selectedDateStr} в ${selectedTime}`;
    hidePhoneError();
    modal.classList.remove('hidden');
  });

  // КНОПКА ОТМЕНА — ЗАКРЫТИЕ БЕЗ КАКИХ-ЛИБО ПРОВЕРОК
  cancelBtn.addEventListener('click', (e) => {
    e.preventDefault();
    closeModal();
  });

  function closeModal() {
    modal.classList.add('hidden');
    hidePhoneError();
  }

  function hidePhoneError() {
    phoneError.classList.add('hidden');
    phoneInput.style.borderColor = 'rgba(0, 0, 0, 0.1)';
  }

  // ПОДТВЕРЖДЕНИЕ — Валидация выполняется ИСКЛЮЧИТЕЛЬНО здесь
  confirmBtn.addEventListener('click', () => {
    const rawPhone = phoneInput.value.replace(/\D/g, '');
    if (rawPhone.length < 10) {
      phoneError.classList.remove('hidden');
      phoneInput.style.borderColor = 'var(--danger)';
      return;
    }

    const payload = {
      service: document.getElementById('service-select').value,
      date: selectedDateStr,
      time: selectedTime,
      name: document.getElementById('client-name').value,
      phone: phoneInput.value
    };

    if (tg && tg.sendData) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Запись отправлена:\n' + JSON.stringify(payload, null, 2));
      closeModal();
    }
  });

  // Старт
  generateDaysRibbon();
  checkReady();
</script>

</body>
</html>
