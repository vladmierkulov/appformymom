<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Запись клиента (для мастера)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --primary: var(--tg-theme-button-color, #007aff);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: #ff3b30;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }

    /* Карточки */
    .card {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    /* Поля ввода */
    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 8px;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    /* Лента дней */
    .days-ribbon {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 4px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .days-ribbon::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 62px;
      padding: 10px 4px;
      background: var(--bg);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .day-chip .weekday {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
      font-weight: 600;
    }

    .day-chip .day-num {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0;
    }

    .day-chip .month-name {
      font-size: 11px;
      color: var(--hint);
    }

    .day-chip.selected {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .day-chip.selected .weekday,
    .day-chip.selected .month-name {
      color: rgba(255, 255, 255, 0.85);
    }

    /* Сетка времени */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .time-slot {
      padding: 10px 4px;
      text-align: center;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .time-slot.selected {
      background: var(--primary);
      color: var(--primary-text);
    }

    .time-slot.custom-btn {
      background: rgba(0, 122, 255, 0.1);
      color: var(--primary);
      grid-column: span 2;
    }

    .custom-time-wrapper {
      margin-top: 10px;
    }

    .custom-time-wrapper input[type="time"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    /* Кнопки действий */
    .actions-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--primary);
      color: var(--primary-text);
      transition: opacity 0.2s;
    }

    .btn-secondary {
      background: transparent;
      color: var(--hint);
      border: 1px solid rgba(0, 0, 0, 0.1);
      flex: 0 0 100px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-bottom: 6px;
      display: block;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h2 class="header-title">Новая запись</h2>

  <!-- Данные клиента -->
  <div class="card">
    <div class="card-title">1. Данные клиента</div>
    <input type="text" id="client-name" class="input-field" placeholder="Имя клиента">
    <input type="tel" id="client-phone" class="input-field" placeholder="Телефон клиента *">
    <span class="error-msg hidden" id="phone-error">Введите корректный номер (от 10 цифр)</span>
    <input type="text" id="booking-note" class="input-field" placeholder="Заметка / Процедура (необязательно)">
  </div>

  <!-- Выбор даты -->
  <div class="card">
    <div class="card-title">2. Дата записи</div>
    <div class="days-ribbon" id="days-container"></div>
  </div>

  <!-- Время начиная с 07:00 -->
  <div class="card">
    <div class="card-title">3. Время записи</div>
    <div class="time-grid" id="time-container">
      <div class="time-slot" data-time="07:00">07:00</div>
      <div class="time-slot" data-time="08:00">08:00</div>
      <div class="time-slot" data-time="09:00">09:00</div>
      <div class="time-slot" data-time="10:00">10:00</div>
      <div class="time-slot" data-time="11:00">11:00</div>
      <div class="time-slot" data-time="12:00">12:00</div>
      <div class="time-slot" data-time="13:00">13:00</div>
      <div class="time-slot" data-time="14:00">14:00</div>
      <div class="time-slot" data-time="15:00">15:00</div>
      <div class="time-slot" data-time="16:00">16:00</div>
      <div class="time-slot" data-time="17:00">17:00</div>
      <div class="time-slot" data-time="18:00">18:00</div>
      <div class="time-slot" data-time="19:00">19:00</div>
      <div class="time-slot" data-time="20:00">20:00</div>
      <div class="time-slot custom-btn" id="custom-time-btn">+ Свое время</div>
    </div>

    <div class="custom-time-wrapper hidden" id="custom-time-box">
      <input type="time" id="custom-time-input" value="07:30">
    </div>
  </div>

  <!-- Действия -->
  <div class="actions-group">
    <!-- Кнопка "Сбросить" просто очищает поля БЕЗ вызова ошибок -->
    <button class="btn btn-secondary" id="reset-btn">Сбросить</button>
    <button class="btn" id="submit-btn">Записать</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let selectedDateStr = null;
  let selectedTime = null;

  const daysContainer = document.getElementById('days-container');
  const timeSlots = document.querySelectorAll('.time-slot:not(.custom-btn)');
  const customTimeBtn = document.getElementById('custom-time-btn');
  const customTimeBox = document.getElementById('custom-time-box');
  const customTimeInput = document.getElementById('custom-time-input');
  
  const clientName = document.getElementById('client-name');
  const clientPhone = document.getElementById('client-phone');
  const bookingNote = document.getElementById('booking-note');
  const phoneError = document.getElementById('phone-error');
  
  const resetBtn = document.getElementById('reset-btn');
  const submitBtn = document.getElementById('submit-btn');

  const weekdays = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

  // Лента на 30 дней вперед
  function generateDaysRibbon() {
    daysContainer.innerHTML = '';
    const today = new Date();

    for (let i = 0; i < 30; i++) {
      const d = new Date();
      d.setDate(today.getDate() + i);

      const year = d.getFullYear();
      const monthStr = String(d.getMonth() + 1).padStart(2, '0');
      const dayStr = String(d.getDate()).padStart(2, '0');
      const fullDateStr = `${year}-${monthStr}-${dayStr}`;

      const chip = document.createElement('div');
      chip.className = 'day-chip';
      chip.innerHTML = `
        <div class="weekday">${weekdays[d.getDay()]}</div>
        <div class="day-num">${d.getDate()}</div>
        <div class="month-name">${months[d.getMonth()]}</div>
      `;

      if (i === 0) {
        chip.classList.add('selected');
        selectedDateStr = fullDateStr;
      }

      chip.addEventListener('click', () => {
        document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedDateStr = fullDateStr;
      });

      daysContainer.appendChild(chip);
    }
  }

  // Выбор стандартного слота времени
  timeSlots.forEach(slot => {
    slot.addEventListener('click', () => {
      clearTimeSelection();
      slot.classList.add('selected');
      selectedTime = slot.dataset.time;
    });
  });

  // Выбор своего времени
  customTimeBtn.addEventListener('click', () => {
    clearTimeSelection();
    customTimeBtn.classList.add('selected');
    customTimeBox.classList.remove('hidden');
    selectedTime = customTimeInput.value;
  });

  customTimeInput.addEventListener('input', (e) => {
    selectedTime = e.target.value;
  });

  function clearTimeSelection() {
    timeSlots.forEach(s => s.classList.remove('selected'));
    customTimeBtn.classList.remove('selected');
    customTimeBox.classList.add('hidden');
    selectedTime = null;
  }

  // КНОПКА СБРОСИТЬ — очищает поля без каких-либо проверок
  resetBtn.addEventListener('click', (e) => {
    e.preventDefault();
    clientName.value = '';
    clientPhone.value = '';
    bookingNote.value = '';
    phoneError.classList.add('hidden');
    clientPhone.style.borderColor = 'rgba(0, 0, 0, 0.1)';
    clearTimeSelection();
    generateDaysRibbon();
  });

  // КНОПКА ЗАПИСАТЬ — Проверка телефона ТОЛЬКО здесь
  submitBtn.addEventListener('click', () => {
    const rawPhone = clientPhone.value.replace(/\D/g, '');
    
    if (rawPhone.length < 10) {
      phoneError.classList.remove('hidden');
      clientPhone.style.borderColor = 'var(--danger)';
      clientPhone.focus();
      return;
    }

    if (!selectedTime) {
      alert('Пожалуйста, выберите время записи.');
      return;
    }

    phoneError.classList.add('hidden');
    clientPhone.style.borderColor = 'rgba(0, 0, 0, 0.1)';

    const payload = {
      role: 'master',
      client_name: clientName.value.trim() || 'Без имени',
      client_phone: clientPhone.value.trim(),
      note: bookingNote.value.trim(),
      date: selectedDateStr,
      time: selectedTime
    };

    if (tg && tg.sendData) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Запись создана в журнале:\n' + JSON.stringify(payload, null, 2));
    }
  });

  generateDaysRibbon();
</script>

</body>
</html>
