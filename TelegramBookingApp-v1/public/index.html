<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бронирование</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* iOS 26/27 Light Theme Glassmorphism & Colors */
      --ios-bg-glass: rgba(255, 255, 255, 0.6);
      --ios-card-glass: rgba(255, 255, 255, 0.8);
      --ios-border: rgba(255, 255, 255, 0.6);
      --ios-accent: #007AFF;
      --ios-accent-gradient: linear-gradient(135deg, #007AFF 0%, #00C6FF 100%);
      --ios-text-primary: #000000;
      --ios-text-secondary: rgba(60, 60, 67, 0.6);
      --ios-shadow: 0 12px 32px 0 rgba(31, 38, 135, 0.08);
      --ios-blur-filter: blur(25px) saturate(190%); /* Renamed for clarity */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* iOS 26/27 Dark Theme Glassmorphism & Colors */
        --ios-bg-glass: rgba(30, 30, 40, 0.4); /* More transparent, slightly lighter for a modern dark glass look */
        --ios-card-glass: rgba(40, 40, 50, 0.55); /* More transparent, slightly lighter */
        --ios-border: rgba(255, 255, 255, 0.15); /* Slightly brighter for better definition */
        --ios-text-primary: #FFFFFF;
        --ios-text-secondary: rgba(235, 235, 245, 0.6);
        --ios-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
        --ios-blur-filter: blur(25px) saturate(190%) brightness(110%); /* Added brightness for dark mode contrast */
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      background: var(--tg-theme-bg-color, #f0f2f5);
      color: var(--ios-text-primary);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      text-align: center;
      margin-top: 8px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--ios-text-secondary);
      margin-top: 4px;
      font-weight: 400;
    }

    /* Liquid Glass Card */
    .glass-card {
      background: var(--ios-card-glass);
      backdrop-filter: var(--ios-blur-filter);
      -webkit-backdrop-filter: var(--ios-blur-filter);
      border: 1px solid var(--ios-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--ios-shadow);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Calendar Header */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .calendar-nav {
      background: var(--ios-bg-glass);
      border: 1px solid var(--ios-border);
      width: 44px; /* Touch-friendly tap target */
      height: 44px; /* Touch-friendly tap target */
      border-radius: 18px; /* Softer square, modern iOS button style */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500; /* Added font-weight */
      color: var(--ios-accent);
      cursor: pointer;
      backdrop-filter: var(--ios-blur-filter); /* Use new blur variable */
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .calendar-nav:active {
      transform: scale(0.9);
    }

    /* Grid Layout */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }

    .day-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-text-secondary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .day-number {
      min-width: 44px; /* Touch-friendly tap target */
      min-height: 44px; /* Touch-friendly tap target */
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 18px; /* Consistent modern iOS button style */
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .day-number.empty {
      cursor: default;
    }

    .day-number:not(.empty):active {
      transform: scale(0.88);
    }

    .day-number.selected {
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
    }

    /* Time Slots Grid */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .time-slot {
      background: var(--ios-bg-glass);
      border: 1px solid var(--ios-border);
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      backdrop-filter: var(--ios-blur-filter); /* Use new blur variable */
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .time-slot:active {
      transform: scale(0.94);
    }

    .time-slot.selected {
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
    }

    /* Input Field Styling */
    .ios-input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--ios-border);
      background: var(--ios-bg-glass); /* Using glass for input background */
      backdrop-filter: var(--ios-blur-filter);
      -webkit-backdrop-filter: var(--ios-blur-filter);
      border-radius: 16px;
      font-size: 16px;
      color: var(--ios-text-primary);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      appearance: none; /* Remove native styling for some input types */
    }

    .ios-input-field::placeholder {
      color: var(--ios-text-secondary);
      opacity: 0.7;
    }

    .ios-input-field:focus {
      border-color: var(--ios-accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    /* Style for the manual time section */
    .manual-time-input-container {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--ios-border); /* Separator */
    }

    .manual-time-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--ios-text-secondary);
    }

    /* Main Floating CTA Button */
    .ios-btn {
      width: 100%;
      background: var(--ios-accent-gradient);
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      margin-top: auto;
    }

    .ios-btn:disabled {
      opacity: 0.4;
      box-shadow: none;
      cursor: not-allowed;
      transform: none !important;
    }

    .ios-btn:not(:disabled):active {
      transform: scale(0.96);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Выбор времени</h1>
    <p>Выберите удобную дату приема</p>
  </div>

  <div class="glass-card">
    <div class="calendar-header">
      <button class="calendar-nav" id="prev-month">&#x276e;</button>
      <h2 id="month-year-label">Месяц</h2>
      <button class="calendar-nav" id="next-month">&#x276f;</button>
    </div>
    
    <div class="days-grid" id="days-container"></div>
  </div>

  <div class="glass-card" id="time-section" style="display: none;">
    <h2 style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ios-text-secondary);">Доступные слоты</h2>
    <div class="time-grid" id="time-container">
      <!-- Time slots will be dynamically generated here by JavaScript -->
    </div>

    <div class="manual-time-input-container">
      <label for="custom-time-input" class="manual-time-label">Или введите свое время:</label>
      <input type="text" id="custom-time-input" class="ios-input-field" placeholder="HH:MM" pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$">
    </div>
  </div>

  <button class="ios-btn" id="submit-btn" disabled onclick="confirmBooking()">Подтвердить запись</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentDate = new Date();
    let selectedDate = null;
    let selectedTime = null;

    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

    // Установка иконки навигации
    document.getElementById('prev-month').innerText = '❮';

    const customTimeInput = document.getElementById('custom-time-input');

    function renderCalendar() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('month-year-label').innerText = `${monthNames[month]} ${year}`;

      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = 'day-name';
        el.innerText = d;
        container.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const startingPoint = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startingPoint; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-number empty';
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-number';
        cell.innerText = day;
        cell.onclick = () => selectDate(cell, day, month, year);
        container.appendChild(cell);
      }
    }

    function generateTimeSlots() {
      const timeContainer = document.getElementById('time-container');
      timeContainer.innerHTML = ''; // Clear existing slots

      const startHour = 9;
      const endHour = 19; // Generate slots up to and including 19:00
      const intervalMinutes = 30;

      let currentHour = startHour;
      let currentMinute = 0;

      while (true) {
        const hourString = String(currentHour).padStart(2, '0');
        const minuteString = String(currentMinute).padStart(2, '0');
        const time = `${hourString}:${minuteString}`;

        const slot = document.createElement('div');
        slot.className = 'time-slot';
        slot.innerText = time;
        slot.onclick = () => selectTime(slot, time);
        timeContainer.appendChild(slot);

        currentMinute += intervalMinutes;
        if (currentMinute >= 60) {
          currentMinute -= 60;
          currentHour++;
        }

        // Break condition: if we've passed the end time
        if (currentHour > endHour || (currentHour === endHour && currentMinute > 0)) {
          break;
        }
      }
    }

    function selectDate(element, day, month, year) {
      tg.HapticFeedback.impactOccurred('light'); // Native haptic feedback
      document.querySelectorAll('.day-number').forEach(e => e.classList.remove('selected'));
      element.classList.add('selected');
      selectedDate = `${day}.${month + 1}.${year}`;
      
      const timeSection = document.getElementById('time-section');
      timeSection.style.display = 'block';
      timeSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Clear any previously selected time and its visual state when a new date is selected
      selectedTime = null;
      document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
      customTimeInput.value = ''; // Clear custom input field
      
      checkForm();
    }

    function selectTime(element, time) {
      tg.HapticFeedback.impactOccurred('light'); // Native haptic feedback
      document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
      element.classList.add('selected');
      selectedTime = time;
      customTimeInput.value = ''; // Clear custom input field if a slot is selected
      checkForm();
    }

    function handleCustomTimeInput() {
      const customValue = customTimeInput.value.trim();
      const timeRegex = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/; // HH:MM format (e.g., 09:30, 15:00, 23:59)

      if (customValue && timeRegex.test(customValue)) {
        // Valid custom time entered
        selectedTime = customValue;
        document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected')); // Deselect all pre-defined slots
        tg.HapticFeedback.impactOccurred('light');
      } else {
        // Invalid or empty custom time entered
        // If selectedTime was previously this customValue, it's no longer valid.
        // Otherwise, don't clear if a slot is already selected.
        if (selectedTime === customValue) {
            selectedTime = null;
        }
      }
      checkForm();
    }

    customTimeInput.addEventListener('input', handleCustomTimeInput);
    customTimeInput.addEventListener('focus', () => {
        // When user focuses on custom input, deselect any pre-selected slots
        document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
        // If selectedTime was from a slot, clear it to ensure custom input takes precedence
        if (selectedTime && document.querySelector(`.time-slot[data-time='${selectedTime}'].selected`)) { // Added data-time for robust check
            selectedTime = null;
        }
        checkForm();
    });


    function checkForm() {
      const btn = document.getElementById('submit-btn');
      if (selectedDate && selectedTime) {
        btn.disabled = false;
        btn.innerText = `Записаться на ${selectedDate} в ${selectedTime}`;
      } else {
        btn.disabled = true;
        btn.innerText = 'Подтвердить запись';
      }
    }

    function confirmBooking() {
      if (selectedDate && selectedTime) {
        tg.HapticFeedback.impactOccurred('medium'); // Native haptic feedback for confirmation
        tg.sendData(JSON.stringify({ date: selectedDate, time: selectedTime }));
        tg.close();
      }
    }

    document.getElementById('prev-month').onclick = () => {
      tg.HapticFeedback.impactOccurred('light'); // Native haptic feedback
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('next-month').onclick = () => {
      tg.HapticFeedback.impactOccurred('light'); // Native haptic feedback
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };

    renderCalendar();
    generateTimeSlots(); // Generate time slots on initial page load
  </script>
</body>
</html>
